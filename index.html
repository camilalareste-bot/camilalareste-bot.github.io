<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=/earth-chain-heart/" />
    <title>RASTREIA.ORG - Redirecionando</title>

      body {

        width: min(92vw, 720px);
        border: 1px solid rgba(255, 255, 255, 0.12);

        background: rgba(255, 255, 255, 0.045);
        padding: 36px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      p {
        color: rgba(229, 243, 234, 0.72);
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 18px;
        border-radius: 8px;

        color: #022c22;
        padding: 12px 18px;
